  <div id="splash" class="splash">

  </div>

  <header class="nav">

        <button class="nav-btn" id="btn-auth-signin">Sign In</button>

  <!-- Episode detail / overview modal -->
  <div id="ep-modal" class="modal hidden">
    <div class="modal-backdrop" id="modal-backdrop"></div>
    <div class="modal-card">
      <button class="modal-close" id="modal-close">✕</button>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <!-- Auth Modal -->
  <div class="modal hidden" id="auth-modal">
    <div class="modal-backdrop" id="auth-backdrop"></div>
    <div class="modal-card auth-card">
      <div class="modal-close" id="auth-close">✕</div>
      <div class="modal-body auth-body">
        <h2 class="auth-title" id="auth-title">Welcome Back</h2>
        <p class="auth-sub" id="auth-sub">Sign in to sync your progress.</p>
        
        <form id="auth-form" class="auth-form">
          <input type="email" id="auth-email" placeholder="Email address" required class="search-input auth-input" />
          <input type="password" id="auth-password" placeholder="Password" required class="search-input auth-input" />
          <div class="auth-error hidden" id="auth-error"></div>
          <div class="auth-success hidden" id="auth-success"></div>
          <button type="submit" class="btn btn-primary auth-submit" id="auth-submit">Sign In</button>
        </form>

        <div class="auth-toggle">
          <span id="auth-toggle-text">Don't have an account? <a href="#" id="auth-toggle-btn">Sign Up</a></span>
        </div>
      </div>
    </div>
  </div>
